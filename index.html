<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
</head>
<body>
    
        <dialog id = 'game-start-dialog'>
            <h3>Tic Tac Toe</h3><br>
            <p> Player 1 (X) : <input type="text" id="player1-name" placeholder="Enter name"></p><br>
            <p> Player 2 (O) : <input type="text" id="player2-name" placeholder="Enter name"></p><br>
            <button id="start-game">Start Game</button>
        </dialog>
       <div id = 'game-container'>
            <div id ='0' class = 'cell'></div>
            <div id ='1' class = 'cell'></div>
            <div id ='2' class = 'cell'></div>
            <div id ='3' class = 'cell'></div>
            <div id ='4' class = 'cell'></div>
            <div id ='5' class = 'cell'></div>
            <div id ='6' class = 'cell'></div>
            <div id ='7' class = 'cell'></div>
            <div id ='8' class = 'cell'></div>
       </div>

       <dialog id = 'winner-dialog'>
        <h3>Game Result</h3><br>
        <p id = 'win-message'>You Win</p><br>
        <button id = 'restart'>Restart Game</button>
       </dialog>
       <script src = 'script.js'></script>

       <dialog id = 'draw-dialog'>
        <h3>Game Result</h3>
        <p id = 'draw-message'>Draw</p>
       </dialog>
</body>
</html>
